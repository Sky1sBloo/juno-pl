name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build
  CMAKE_BUILD_TYPE: Release

jobs:

  build-and-test:
    name: Build & test (Linux, Clang)
    runs-on: ubuntu-24.04
    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build
      - name: Check C++23 support
        run: |
          clang++ --version
              clang++ -v
              g++ --version
          
              echo '#include <expected>
              #include <iostream>
              int main() {
                  std::expected<int, int> x = 42;
                  std::cout << *x;
              }' > expected.cpp
          
              clang++ -std=c++23 expected.cpp -o expected
      # CMakeLists.txt requires CMake >= 4.0.0, which is newer than the
      # version preinstalled on the runner.
      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: >
          cmake -S . -B "$BUILD_DIR"
          -G Ninja
          -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE"
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure

      - name: Package binary
        run: |
          mkdir -p dist
          tar -czf "dist/juno-pl-${GITHUB_REF_NAME}.tar.gz" -C "$BUILD_DIR" juno-pl

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: juno-pl-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: juno-pl-linux-x86_64
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
